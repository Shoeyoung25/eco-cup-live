<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eco Cup Trivia Screen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<link rel="stylesheet" href="../js/base.css">
<script src="../js/qrcode.js"></script>
<style>
/* Big screen: driven entirely by the operator. Shows questions, pictures, plays music, and a live board of who has answered. */
html,body{height:100%}
body{overflow:hidden;font-size:clamp(16px,1.6vw,30px)}
.stage{position:fixed;inset:0;display:grid;grid-template-rows:auto 1fr auto;padding:2.2vw 3vw}
.bar{display:flex;justify-content:space-between;align-items:center;gap:2vw}
.bar .brand{font:700 1.3em var(--display);text-transform:uppercase;letter-spacing:.06em;color:var(--accent)}
.bar .meta{font:700 1.3em var(--display);text-transform:uppercase;color:var(--muted)}
.center{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:2vh;min-height:0}
.huge{font:700 6.5vw/1 var(--display);text-transform:uppercase}
.big{font:700 3.6vw/1.05 var(--display);text-transform:uppercase}
.qtext{font-size:3vw;font-weight:600;line-height:1.2;max-width:85vw}
.rules{font-size:2.1vw;text-align:left;margin:0;padding-left:1.2em}
.rules li{margin:.5vh 0}
.media{max-width:80vw;max-height:52vh;min-height:0;border-radius:1vw;object-fit:contain}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:1.2vw;width:min(90vw,1500px)}
.opts div{display:flex;align-items:center;gap:1vw;border:.25vw solid var(--k);background:color-mix(in srgb,var(--k) 12%,var(--surface));border-radius:1vw;padding:1.2vw 1.5vw;font-size:2.2vw;font-weight:600;text-align:left}
.opts .l{flex:none;width:3.4vw;height:3.4vw;border-radius:.6vw;background:var(--k);color:#fff;display:grid;place-items:center;font:700 2.4vw var(--display)}
.opts .right{outline:.4vw solid var(--accent);outline-offset:.3vw}
.opts .dim{opacity:.35}
.count{font:700 5vw/1 var(--display);min-width:2ch;text-align:center}
.count.low{color:var(--danger)}
.ring{display:flex;align-items:center;gap:1.4vw}
.board{display:flex;flex-wrap:wrap;justify-content:center;gap:.8vw;padding-top:1.4vh}
.chip{min-width:7.5vw;padding:.7vw 1vw;border-radius:.8vw;border:.18vw solid var(--line);background:var(--surface);text-align:center;transition:background .2s,border-color .2s}
.chip b{display:block;font:700 2.3vw/1 var(--display)}
.chip span{display:block;font-size:.85vw;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:12vw}
.chip.done{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.chip.done span{color:var(--accent-fg)}
.boardlbl{text-align:center;font:700 1em var(--display);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.answer{font:700 4.5vw/1.1 var(--display);color:var(--accent)}
#qr{background:#fff;padding:1vw;border-radius:1vw;line-height:0}
#qr svg,#qr img{width:min(26vh,22vw);height:auto}
.join{font-size:2vw;font-weight:600}
table.scores{border-collapse:collapse;font-size:1.7vw;min-width:60vw}
table.scores th{font:700 1.2em var(--display);text-transform:uppercase;color:var(--muted);padding:.5vw 1.2vw;text-align:center}
table.scores td{padding:.55vw 1.2vw;border-top:1px solid var(--line);text-align:center}
table.scores td.t{text-align:left;font-weight:600}
table.scores td.tot{font:700 1.4em var(--display)}
table.scores th.sorted,table.scores td.sorted{background:var(--hl)}
.tk{font-size:.7em;color:var(--warn);font-weight:700;margin-left:.2em}
.blank{position:fixed;inset:0;background:#000;display:grid;place-items:center;color:#2b3a31;font:700 3vw var(--display);text-transform:uppercase;letter-spacing:.1em}
.start{position:fixed;inset:0;z-index:20;background:var(--bg);display:grid;place-items:center;text-align:center}
.start button{font-size:28px;padding:20px 40px}
.audio-ind{font:700 1.4em var(--display);text-transform:uppercase;color:var(--muted);display:flex;gap:.6em;align-items:center}
.eq{display:inline-flex;gap:.25em;align-items:flex-end;height:1.2em}
.eq i{width:.3em;background:var(--accent);animation:eq 0.9s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.4s}.eq i:nth-child(4){animation-delay:.1s}
@keyframes eq{0%,100%{height:.3em}50%{height:1.2em}}
.paused .eq i{animation:none;height:.3em}
.conn{position:fixed;right:1vw;bottom:1vw;display:flex;gap:.4em;align-items:center;font-size:.8em;color:var(--muted)}
</style>
</head>
<body>
<div class="start" id="start"><div><h1 style="font-size:40px;margin-bottom:10px">Eco Cup Trivia: question screen</h1>
<p class="muted" style="font-size:20px;max-width:640px">Put this on the projector and press Start so the browser allows sound. Then press F11 (or Ctrl+Cmd+F on a Mac) for full screen.</p>
<button class="btn primary" id="go">Start the screen</button></div></div>
<div class="stage" id="stage">
  <div class="bar"><span class="brand">Eco Cup Trivia</span><span class="meta" id="meta"></span></div>
  <div class="center" id="center"></div>
  <div><div class="boardlbl" id="boardlbl"></div><div class="board" id="board"></div></div>
</div>
<div class="blank" id="blank" hidden>Eco Cup</div>
<div class="conn"><span class="dot" id="dot"></span><span id="conn"></span></div>
<audio id="audio" preload="auto"></audio>
<script type="module">
import { ROUNDS, round, LETTERS, TOKENS, esc, teamName, playingTeams, fmtScore } from "../js/core.js";
import { live, get, now, syncClock, MEDIA, $ } from "../js/db.js";

let D = {}, OK = false, lastKey = "";
live((d, ok) => { D = d; OK = ok; render(); });
syncClock();
// the click on Start counts as the user gesture browsers need before a page may play sound
$("go").onclick = () => { $("start").hidden = true; render(true); };

/* ---------- media ---------- */
const mediaCache = {}, loading = {};
async function media(key) {
  if (!key) return null;
  if (mediaCache[key]) return mediaCache[key];
  if (!loading[key]) loading[key] = get(`${MEDIA}/${encodeURIComponent(key)}`).then(m => { mediaCache[key] = m; render(true); return m; }).catch(() => { delete loading[key]; return null; });
  return null;
}
// audio: plays twice automatically when the question opens; the operator can trigger a replay
let audioFor = "", plays = 0, replaySeen = 0, gapTimer = null;
function audioControl(s, q, key) {
  const a = $("audio");
  const id = `${s.round}.${s.q}`;
  const m = mediaCache[q.media];
  const isAudio = q.media && (q.mediaKind === "audio" || m?.type?.startsWith("audio"));
  if (!isAudio || !m || (s.phase !== "open" && s.phase !== "closed")) {
    if (audioFor && (s.phase !== "open" && s.phase !== "closed" || audioFor !== id)) { a.pause(); clearTimeout(gapTimer); audioFor = ""; }
    return;
  }
  if (audioFor !== id) {
    audioFor = id; plays = 0; replaySeen = Number(s.replay) || 0;
    if (s.phase === "open") { a.src = m.data; playOnce(); }
    return;
  }
  if ((Number(s.replay) || 0) > replaySeen) { replaySeen = Number(s.replay); plays = 1; if (!a.src) a.src = m.data; playOnce(); }
}
function playOnce() {
  const a = $("audio"); clearTimeout(gapTimer);
  a.currentTime = 0; plays++;
  a.play().catch(() => {});
  render(true);
}
$("audio").addEventListener("ended", () => { if (plays < 2) gapTimer = setTimeout(playOnce, 1500); else render(true); });
$("audio").addEventListener("play", () => render(true));
$("audio").addEventListener("pause", () => render(true));

/* ---------- board ---------- */
function board(kind, s) {
  const r = s.round, n = s.q, teams = playingTeams(D.config);
  let done = () => false, lbl = "";
  if (kind === "token") { done = t => !!D.tokens?.[r]?.[t]; lbl = "Prats token decided"; }
  if (kind === "wager") { done = t => !!D.wagers?.[r]?.[n]?.[t]; lbl = "Weight locked in"; }
  if (kind === "answer") { done = t => !!D.answers?.[r]?.[n]?.[t]; lbl = "Answered"; }
  if (kind === "joined") { lbl = "Teams"; }
  const html = kind ? teams.map(t => `<div class="chip ${done(t) ? "done" : ""}"><b>${t}</b><span>${esc(teamName(D.config, t))}</span></div>`).join("") : "";
  return { html, lbl: kind ? `${lbl}${kind !== "joined" ? ` · ${teams.filter(done).length} of ${teams.length}` : ""}` : "" };
}

/* ---------- scores ---------- */
function scoresView(s) {
  const teams = playingTeams(D.config);
  const pub = ROUNDS.filter(R => D.results?.[R.n]?.published);
  const val = (t, r) => D.results?.[r]?.rows?.[t];
  const total = t => pub.reduce((a, R) => a + (Number(val(t, R.n)?.final) || 0), 0);
  const sort = s.sort && s.sort !== "total" ? Number(s.sort) : "total";
  const key = t => (sort === "total" ? total(t) : Number(val(t, sort)?.final ?? -999));
  const rows = [...teams].sort((a, b) => key(b) - key(a) || a - b);
  const sortName = sort === "total" ? "Night total" : `Round ${sort}: ${round(sort).name}`;
  return `<div class="big">Scores</div><div class="muted" style="font-size:1.4vw">Sorted by ${esc(sortName)}</div>
    <table class="scores"><thead><tr><th style="text-align:left">Team</th>${ROUNDS.map(R => `<th class="${sort === R.n ? "sorted" : ""}">R${R.n}</th>`).join("")}<th class="${sort === "total" ? "sorted" : ""}">Total</th></tr></thead>
    <tbody>${rows.map(t => `<tr><td class="t">${esc(teamName(D.config, t))}</td>${ROUNDS.map(R => { const v = val(t, R.n); return `<td class="${sort === R.n ? "sorted" : ""}">${v && D.results[R.n].published ? `${v.final}${v.token ? `<span class="tk">T${v.token}</span>` : ""}` : "–"}</td>`; }).join("")}<td class="tot ${sort === "total" ? "sorted" : ""}">${total(t)}</td></tr>`).join("")}</tbody></table>`;
}

/* ---------- main view ---------- */
function joinURL() {
  const u = new URL("../", location.href);
  const db = new URLSearchParams(location.search).get("db");
  if (db) u.searchParams.set("db", db);
  return u.href;
}
function qrSVG(text) {
  try { const q = qrcode(0, "M"); q.addData(text); q.make(); return q.createSvgTag({ cellSize: 6, margin: 0, scalable: true }); } catch (e) { return ""; }
}
function view(s) {
  const r = Number(s.round) || 0, n = Number(s.q) || 0, R = r ? round(r) : null;
  const total = Number(s.nq?.[r]) || 0;
  if (s.screen === "scores") return { meta: "Scores", html: scoresView(s), board: board(null, s) };
  if (!r || s.phase === "lobby") {
    const url = joinURL();
    return { meta: "", html: `<div class="huge">Trivia Night</div><div class="ring"><div id="qr">${qrSVG(url)}</div><div style="text-align:left"><div class="join">Scan to join,<br>then tap your team</div><div class="muted" style="font-size:1.3vw;margin-top:1vh;overflow-wrap:anywhere;max-width:40vw">${esc(url.replace(/^https?:\/\//, ""))}</div></div></div>`, board: board("joined", s) };
  }
  const meta = `Round ${r} · ${R.name}`;
  if (s.phase === "round") return { meta: `Round ${r} of 6`, html: `<div class="huge">${esc(R.name)}</div><ul class="rules">${R.rules.map(x => `<li>${esc(x)}</li>`).join("")}</ul><div class="muted" style="font-size:1.6vw">Decide on your Prats token now</div>`, board: s.tokenLock?.[r] ? board(null, s) : board("token", s) };
  if (s.phase === "roundEnd") return { meta, html: `<div class="big muted">Round ${r}</div><div class="huge">${esc(R.name)} complete</div>`, board: board(null, s) };
  const q = D.q?.[r]?.[n] || {};
  if (q.media) media(q.media); // preload during prep
  if (s.phase === "qprep") {
    const hint = R.scoring === "wager" && q.hint ? `<div class="muted" style="font-size:1.8vw">Hint</div><div class="big">${esc(q.hint)}</div><div class="muted" style="font-size:1.6vw">Lock in your weight on your phone</div>` : `<div class="muted" style="font-size:1.8vw">Get ready</div>`;
    return { meta, html: `<div class="huge">Question ${n}${total ? `<span class="muted" style="font-size:.5em"> of ${total}</span>` : ""}</div>${hint}`, board: R.scoring === "wager" ? board("wager", s) : board(null, s) };
  }
  // open, closed, reveal
  const m = q.media ? mediaCache[q.media] : null;
  const isAudio = q.media && (q.mediaKind === "audio" || m?.type?.startsWith("audio"));
  let mediaHTML = "";
  if (q.media && !m) mediaHTML = `<div class="muted">Loading ${isAudio ? "audio" : "picture"}…</div>`;
  else if (m && isAudio) { const a = $("audio"); mediaHTML = `<div class="audio-ind ${a.paused ? "paused" : ""}"><span class="eq"><i></i><i></i><i></i><i></i></span>${a.paused ? (plays >= 2 ? "Played twice" : "Music") : `Playing ${plays} of 2`}</div>`; }
  else if (m) mediaHTML = `<img class="media" src="${m.data}" alt="">`;
  const rev = s.phase === "reveal" ? D.reveal?.[r]?.[n] : null;
  let opts = "";
  if (q.type === "mc" && q.options) opts = `<div class="opts">${LETTERS.map((L, i) => `<div class="mc-${L.toLowerCase()} ${rev ? (rev.letter === L ? "right" : "dim") : ""}"><span class="l">${L}</span><span>${esc(q.options[i] ?? "")}</span></div>`).join("")}</div>`;
  const closed = s.phase !== "open" || (s.closeAt && now() >= s.closeAt);
  const status = rev ? `<div class="answer">${esc(rev.text)}</div>` : closed ? `<div class="big muted">Time's up</div>` : "";
  return { meta: `${meta} · Q${n}${total ? ` of ${total}` : ""}`, timer: !closed, html: `${q.text ? `<div class="qtext">${esc(q.text)}</div>` : ""}${mediaHTML}${opts}${status}`, board: board("answer", s) };
}

function render(force) {
  $("dot").className = "dot" + (OK ? " live" : "");
  $("conn").textContent = OK ? "" : "Reconnecting…";
  const s = D.state || { phase: "lobby" };
  $("blank").hidden = s.screen !== "blank";
  const q = D.q?.[s.round]?.[s.q] || {};
  if (q.media) media(q.media);
  audioControl(s, q);
  const v = view(s);
  $("meta").innerHTML = esc(v.meta) + (v.timer ? ` <span class="count" id="count"></span>` : "");
  const key = v.html;
  if (force || key !== lastKey) { lastKey = key; $("center").innerHTML = v.html; }
  $("board").innerHTML = v.board.html; $("boardlbl").textContent = v.board.lbl;
  tick();
}
function tick() {
  const s = D.state || {};
  const el = $("count");
  if (!el) return;
  const left = Math.max(0, (s.closeAt || 0) - now());
  el.textContent = Math.ceil(left / 1000);
  el.classList.toggle("low", left < 5000);
  if (left <= 0) render(true);
}
setInterval(tick, 250);
</script>
</body>
</html>
